name: Build Irodori iPhone IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build iPhone app
        run: |
          xcodebuild \
            -project Examples/IrodoriSamples.xcodeproj \
            -scheme IrodoriiOS \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath "$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/IrodoriiOS.app Payload/
          ditto -c -k --sequesterRsrc --keepParent Payload Irodori-CoreML-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Irodori-CoreML-iPhone
          path: Irodori-CoreML-unsigned.ipa
          retention-days: 7
